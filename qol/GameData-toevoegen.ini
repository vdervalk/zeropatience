;=============================================================================
;  zeropatience - comfortinstellingen
;=============================================================================
;
;  LET OP: DIT IS GEEN LOSSTAAND BESTAND
;
;  Deze regels moeten TOEGEVOEGD worden aan het bestaande GameData-blok van
;  het spel. Zet je dit als los bestand in Data\INI\, dan start het spel niet
;  meer op. Dat is precies wat er misging bij de eerste poging.
;
;
;  WAAROM VERVANGEN NIET WERKT
;
;  De engine laadt bij het opstarten twee bestanden:
;
;      if (path1) ini.load(path1, INI_LOAD_OVERWRITE, pXfer );  ; Default\GameData.ini
;      if (path2) ini.load(path2, INI_LOAD_OVERWRITE, pXfer );  ; GameData.ini
;
;  Die twee tests kijken naar de pointer, niet naar het bestand. Het zijn
;  string-literals, dus beide zijn altijd waar en beide bestanden worden
;  altijd geladen. Ontbreekt er een, dan gooit prepFile een exceptie:
;
;      m_file = TheFileSystem->openFile(filename.str(), File::READ);
;      if( m_file == NULL ) throw INI_CANT_OPEN_FILE;
;
;  Omdat het spel zonder ingrijpen gewoon start, bestaat Data\INI\GameData.ini
;  dus al binnen het .big-archief, met echte inhoud. Een los bestand met
;  dezelfde naam wint van het archief en gooit die inhoud weg.
;
;
;  HOE DAN WEL
;
;  1. Haal Data\INI\GameData.ini uit het INI-archief van het spel
;     (INI.big bij Generals, INIZH.big bij Zero Hour).
;  2. Plak de regels hieronder onderaan in het GameData-blok, net voor End.
;  3. Zet het resultaat in <spelmap>\Data\INI\GameData.ini.
;
;  Maak eerst een kopie van het origineel, dan kun je altijd terug.
;
;
;  MULTIPLAYER
;
;  Het spel berekent een checksum over de INI-bestanden (de xferCRC die bij
;  het laden wordt meegegeven). Reken dus op een mismatch in netwerkpotjes.
;
;=============================================================================


  ;--- Beeldsnelheid -------------------------------------------------------
  ;
  ;  De hoofdlus begrenst met een wachtlus:
  ;
  ;      DWORD limit = (1000.0f/m_maxFPS)-1;
  ;      while (m_useFpsLimit && (now - prevTime) < limit) Sleep(0);
  ;
  ;  Zet UseFPSLimit nooit op Yes met FramesPerSecondLimit op 0: dan wordt
  ;  limit oneindig en blijft die lus draaien.
  ;
  ;  De simulatie blijft hoe dan ook op 30 Hz lopen, want
  ;  LOGICFRAMES_PER_SECOND is een compile-time constante en replays zijn
  ;  lockstep. Vloeiender beeld dus, geen sneller spel.

  UseFPSLimit = Yes
  FramesPerSecondLimit = 60

  ;--- Camerahoogte --------------------------------------------------------
  ;
  ;  Standaard staat het maximum op 300, wat op een breed scherm krap is.
  ;  Boven ongeveer 600 zie je de rand van de kaart.

  MaxCameraHeight = 450

  ;--- Camera-gevoel -------------------------------------------------------
  ;
  ;  Hoe snel de camera zijn hoogte bijstelt tijdens het scrollen.

  CameraAdjustSpeed = 0.3
