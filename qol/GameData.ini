;=============================================================================
;  zeropatience - comfortinstellingen voor Generals en Zero Hour
;=============================================================================
;
;  WAAR DIT HEEN MOET
;
;    <spelmap>\Data\INI\GameData.ini
;
;  Bijvoorbeeld:
;    ...\Command and Conquer Generals\Data\INI\GameData.ini
;    ...\Command & Conquer Generals - Zero Hour\Data\INI\GameData.ini
;
;  Bestaat dat bestand al? Vervang het dan NIET, maar plak deze regels
;  eronder in het bestaande GameData-blok.
;
;
;  WAAROM EEN KLEIN BESTAND VEILIG IS
;
;  De engine laadt bij het opstarten twee bestanden achter elkaar:
;
;      initSubsystem(TheWritableGlobalData, ...,
;                    "Data\INI\Default\GameData.ini",   <- alle standaarden
;                    "Data\INI\GameData.ini");          <- dit bestand
;
;  Het parsen zet alleen velden die daadwerkelijk in het bestand staan, dus
;  dit stapelt bovenop de standaarden in plaats van ze te vervangen. Je hoeft
;  het originele bestand dus niet uit het .big-archief te halen.
;
;
;  MULTIPLAYER
;
;  Deze bestanden gaan mee in een checksum die het spel over de INI's
;  berekent (de xferCRC bij het laden hierboven). Verwacht dus een mismatch
;  in een netwerkpotje. Voor skirmish en campagne maakt het niets uit.
;
;=============================================================================

GameData

  ;--- Beeldsnelheid -------------------------------------------------------
  ;
  ;  De hoofdlus begrenst met een wachtlus:
  ;
  ;      DWORD limit = (1000.0f/m_maxFPS)-1;
  ;      while (m_useFpsLimit && (now - prevTime) < limit) Sleep(0);
  ;
  ;  LET OP: zet UseFPSLimit nooit op Yes met FramesPerSecondLimit op 0.
  ;  Dan wordt limit oneindig en blijft die lus draaien.
  ;
  ;  De simulatie blijft hoe dan ook op 30 Hz lopen, want
  ;  LOGICFRAMES_PER_SECOND is een compile-time constante en multiplayer en
  ;  replays zijn lockstep. Je krijgt dus een vloeiender beeld en camera,
  ;  geen sneller spel.
  ;
  ;  60 is een veilige keuze. Hoger mag, maar uitzetten (UseFPSLimit = No)
  ;  raad ik af: dan rendert het spel zo hard als je kaart kan, met warmte
  ;  en spoelgepiep als dank.

  UseFPSLimit = Yes
  FramesPerSecondLimit = 60

  ;--- Camerahoogte --------------------------------------------------------
  ;
  ;  Standaard staat het maximum op 300, wat op een breed scherm krap is.
  ;  Dit is waarschijnlijk de grootste comfortwinst van het hele bestand.
  ;
  ;  Ga niet meteen extreem hoog: boven ongeveer 600 zie je de rand van de
  ;  kaart en gedraagt de mist zich vreemd. Begin hier en stel bij naar
  ;  smaak.

  MaxCameraHeight = 450
  MinCameraHeight = 100

  ;--- Camera-gevoel -------------------------------------------------------
  ;
  ;  Hoe snel de camera zijn hoogte bijstelt tijdens het scrollen. Hoger is
  ;  directer, lager is rustiger.

  CameraAdjustSpeed = 0.3

  ;--- Uitgeschakeld gelaten -----------------------------------------------
  ;
  ;  Deze staan er bewust niet in:
  ;
  ;  KeyboardScrollSpeedFactor
  ;      Zinloos hier. Direct na het parsen overschrijft het spel dit met de
  ;      waarde uit het optiescherm:
  ;          m_keyboardScrollFactor = optionPref.getScrollFactor();
  ;      Stel de scrollsnelheid dus gewoon in het spel in.
  ;
  ;  XResolution / YResolution / Windowed
  ;      Bestaan wel, maar worden eveneens door de opties en het register
  ;      gezet. Via dit bestand zetten helpt niet.
  ;
  ;  UseCameraConstraints = No
  ;      Haalt de begrenzing weg zodat je voorbij de kaartrand kunt scrollen.
  ;      Werkt, maar je kijkt dan tegen niet-getekende leegte aan. Wil je het
  ;      toch proberen, haal dan de puntkomma weg:
  ;
  ; UseCameraConstraints = No

End
